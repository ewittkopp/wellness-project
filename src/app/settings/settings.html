<div class="container py-4">

    <h2 class="mb-4">Settings</h2>

    @if (errorMessage()) {
    <div class="alert alert-danger">{{ errorMessage() }}</div>
    }

    @if (successMessage()) {
    <div class="alert alert-success">{{ successMessage() }}</div>
    }

    <section class="mb-5">
        <h4>Update Profile Info</h4>

        <input class="form-control mb-2" placeholder="New First Name" [value]="firstName()"
            (input)="firstName.set($event.target.value)" />

        <input class="form-control mb-2" placeholder="New Last Name" [value]="lastName()"
            (input)="lastName.set($event.target.value)" />

        <input class="form-control mb-3" placeholder="New Email" type="email" [value]="email()"
            (input)="email.set($event.target.value)" />

        <button class="btn btn-success" (click)="updateProfile()" [disabled]="isLoading()">
            Save Profile
        </button>
    </section>

    <section class="mb-5">
        <h4>Notifications</h4>

        <div class="form-check">
            <input type="checkbox" [checked]="notifications().dailyCheckIn" (change)="notifications.set({
          ...notifications(),
          dailyCheckIn: $event.target.checked
        })" />
            <label>Daily Check-In</label>
        </div>

        <div class="form-check">
            <input type="checkbox" [checked]="notifications().habitReminder" (change)="notifications.set({
          ...notifications(),
          habitReminder: $event.target.checked
        })" />
            <label>Habit Reminder</label>
        </div>

        <div class="form-check">
            <input type="checkbox" [checked]="notifications().weeklySummary" (change)="notifications.set({
          ...notifications(),
          weeklySummary: $event.target.checked
        })" />
            <label>Weekly Summary</label>
        </div>

        <button class="btn btn-success mt-3" (click)="updateNotifications()" [disabled]="isLoading()">
            Save Notifications
        </button>
    </section>

    <section class="mb-5">
        <h4>Change Password</h4>

        <input class="form-control mb-2" type="password" placeholder="New password" [value]="password()"
            (input)="password.set($event.target.value)" />

        <input class="form-control mb-3" type="password" placeholder="Confirm password" [value]="confirmPassword()"
            (input)="confirmPassword.set($event.target.value)" />

        <button class="btn btn-warning" (click)="changePassword()" [disabled]="isLoading()">
            Update Password
        </button>
    </section>

    <section>
        <h4>Deactivate Account</h4>

        <button class="btn btn-danger" (click)="deactivateAccount()" [disabled]="isLoading()">
            Deactivate Account
        </button>
    </section>

</div>
