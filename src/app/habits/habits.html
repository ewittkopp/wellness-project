<div class="container mt-4">

  
  <div class="card p-3 mb-4">
    <h5>Add New Habit</h5>

    <div class="d-flex gap-2 mt-2">
       <label>Habit Name:</label>
      <input 
        type="text" 
        class="form-control"
        placeholder="Enter habit"
        [ngModel]="name()" 
        (ngModelChange)="name.set($event)"
      >

      <label>frequency:</label>
      <select 
        class="form-select"
        [ngModel]="frequency()" 
        (ngModelChange)="frequency.set($event)"
      >
      <option value="Daily">Daily</option>
        <option value="Weekly">Weekly</option>
      </select>

      @if (selectedHabit()) {
        <button class="btn btn-warning" (click)="editHabit()">Edit</button>
      } @else {
        <button class="btn btn-primary" (click)="addHabit()">Add</button>
      }
    </div>
  </div>

  <h5>Active Habits</h5>

  @for (h of habitService.habits(); track h.id) {
    <div class="card p-3 mb-3">

    
      <h6>{{ h.name }}</h6>
      <p class="text-muted">{{ h.frequency }}</p>

      
      <p>Tracked Days: {{ h.trackedDays }}</p>
      <p>Completed Days: {{ h.completedDays }}</p>

    
      <p>
        Completion Rate: 
        {{ (h.completionRate * 100) | number:'1.0-0' }}%
      </p>

    
      <div class="progress mb-2">
        <div 
          class="progress-bar" 
          role="progressbar"
          [style.width.%]="h.completionRate * 100"
        ></div>
      </div>

      
      <div class="form-check mb-2">
        <input 
          class="form-check-input" 
          type="checkbox" 
          (change)="markComplete(h)"
        >
        <label class="form-check-label">
          Mark Today as Completed
        </label>
      </div>

     
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-primary" (click)="selectHabit(h)">
          Edit
        </button>

        <button class="btn btn-sm btn-outline-danger" (click)="deleteHabit(h.id!)">
          Delete
        </button>
      </div>

    </div>
  }

</div>
